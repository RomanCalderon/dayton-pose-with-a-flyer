[package]
name = "pose-with-a-flyer"
version = "0.1.10"
description = "Pose with a Flyer arena photo-op kiosk prototype"
authors = ["Pose with a Flyer prototype"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pose_with_a_flyer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pose-with-a-flyer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
